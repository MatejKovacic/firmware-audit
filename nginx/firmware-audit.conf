server {
    listen 443 ssl http2;
    server_name firmware-audit.example.org;

    ssl_certificate     /etc/letsencrypt/live/firmware-audit.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/firmware-audit.example.org/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 90s;
    }
}
